<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tes: Rock Pikmin</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; background: black; }
      #material { position: fixed; top: 12px; left: 12px; width: 240px; padding: 10px 12px; border-radius: 8px;
                  background: rgba(20, 25, 40, 0.75); color: #fff; font: 13px sans-serif; }
      #material b { display: block; margin-bottom: 6px; }
      #material label { display: block; margin-top: 6px; }
      #material input { width: 100%; }
      #material code { display: block; margin-top: 8px; font-size: 11px; color: #cde; word-break: break-all; }
    </style>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <canvas id="mycanvas"></canvas>
    <div id="material">
      <b>Material badan batu</b>
      <label>Kilap (ketajaman): <span data-nilai="kilap"></span>
        <input type="range" data-kunci="kilap" min="1" max="128" step="1" /></label>
      <label>Kekuatan kilap: <span data-nilai="kekuatanKilap"></span>
        <input type="range" data-kunci="kekuatanKilap" min="0" max="1" step="0.01" /></label>
      <label>Tekstur: <span data-nilai="tekstur"></span>
        <input type="range" data-kunci="tekstur" min="0" max="1" step="0.01" /></label>
      <label>Skala tekstur: <span data-nilai="skalaTekstur"></span>
        <input type="range" data-kunci="skalaTekstur" min="1" max="20" step="0.5" /></label>
      <code id="salin"></code>
    </div>
  </body>
</html>
